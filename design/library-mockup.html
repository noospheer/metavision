<title>Klepton Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
  :root{
    --ground:#05080B;
    --panel:#070C10;
    --phosphor:#4AF626;
    --dim:#3FA82C;
    --ghost:#163A12;
    --rule:#0F2A0C;
    --amber:#FFB000;
    --fault:#FF5F56;
    --fovea:#4FD6E0;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    background:var(--ground);
    color:var(--phosphor);
    font-family:var(--mono);
    font-size:14px;
    line-height:1.5;
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:40px 20px 28px;
    background-image:radial-gradient(ellipse 900px 600px at 50% 42%,#0A1410 0%,var(--ground) 70%);
  }

  /* ---- visionOS window chrome ---- */
  .window{
    width:min(1080px,100%);
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:30px;
    box-shadow:0 0 0 1px #0A1A08, 0 40px 90px -30px #000, 0 0 120px -40px rgba(74,246,38,.22);
    overflow:hidden;
    position:relative;
  }
  .window::after{
    content:"";
    position:absolute;inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(74,246,38,.035) 0 1px,transparent 1px 3px);
    mix-blend-mode:screen;
  }
  .bar{
    width:132px;height:5px;border-radius:3px;
    background:var(--ghost);
    box-shadow:0 0 14px rgba(74,246,38,.18);
  }
  .barcap{
    font-family:var(--cond);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:#1E4D18;
  }

  /* ---- header ---- */
  header{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding:20px 26px 14px;
    border-bottom:1px solid var(--rule);
  }
  .mark{font-weight:600;letter-spacing:.06em;font-size:15px}
  .mark .slash{color:var(--ghost)}
  .path{color:var(--dim);font-size:13px}
  .cursor{
    display:inline-block;width:8px;height:15px;
    background:var(--phosphor);vertical-align:-2px;margin-left:2px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .runtime{
    margin-left:auto;font-family:var(--cond);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
    display:flex;gap:18px;
  }
  .runtime b{color:var(--phosphor);font-weight:600}

  /* ---- column headers ---- */
  .cols{
    display:grid;
    grid-template-columns:1fr 84px 76px 78px 88px;
    gap:12px;
    padding:9px 26px;
    font-family:var(--cond);font-size:10px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:#2A6B22;
    border-bottom:1px solid var(--rule);
  }
  .cols span:not(:first-child){text-align:center}

  /* ---- tree ---- */
  .tree{
    padding:8px 14px 12px;
    max-height:calc(100vh - 320px);
    min-height:320px;
    overflow-y:auto;
    overflow-x:auto;
  }
  .tree::-webkit-scrollbar{width:8px;height:8px}
  .tree::-webkit-scrollbar-thumb{background:var(--ghost);border-radius:4px}

  .group{margin-bottom:2px}
  .grouphead{
    display:flex;align-items:center;gap:9px;
    width:100%;text-align:left;
    background:none;border:0;color:inherit;font:inherit;
    padding:7px 12px;border-radius:8px;cursor:pointer;
  }
  .grouphead:hover{background:#0B1A09}
  .grouphead:focus-visible{outline:1px solid var(--phosphor);outline-offset:-1px}
  .chev{color:var(--dim);width:10px;display:inline-block;transition:transform .14s ease}
  .group[data-open="false"] .chev{transform:rotate(-90deg)}
  .gname{font-weight:600;letter-spacing:.02em}
  .gmeta{
    font-family:var(--cond);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:#2A6B22;
  }
  .gtag{
    margin-left:auto;font-family:var(--cond);font-size:10px;font-weight:600;
    letter-spacing:.12em;text-transform:uppercase;
    padding:2px 8px;border-radius:3px;border:1px solid;
  }
  .gtag.ok{color:var(--dim);border-color:var(--rule)}
  .gtag.blocked{color:var(--fault);border-color:#3A1512;background:#160707}
  .group[data-open="false"] .rows{display:none}

  /* ---- rows ---- */
  .rows{padding:2px 0 6px}
  .row{
    display:grid;
    grid-template-columns:1fr 84px 76px 78px 88px;
    gap:12px;align-items:center;
    width:100%;text-align:left;
    background:none;border:0;color:inherit;font:inherit;
    padding:6px 12px;border-radius:7px;
    cursor:pointer;position:relative;overflow:hidden;
    min-width:640px;
  }
  .row:focus-visible{outline:1px solid var(--phosphor);outline-offset:-1px}
  .glyph{color:var(--ghost);user-select:none;letter-spacing:-.5px}
  .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.blocked .name,.row.blocked .glyph{color:#2A5E22}

  /* hover models — behavior encodes the gaze badge */
  .row .spot{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
    transition:opacity .18s ease;
  }
  .row[data-gaze="SHADER"] .spot{
    background:radial-gradient(120px circle at var(--mx,50%) var(--my,50%),rgba(74,246,38,.26),rgba(74,246,38,.05) 45%,transparent 72%);
  }
  .row[data-gaze="SHADER"]:hover .spot{opacity:1}
  .row[data-gaze="SHADER"]:hover{box-shadow:inset 0 0 0 1px rgba(74,246,38,.35)}

  .row[data-gaze="PINCH"]:hover{box-shadow:inset 0 0 0 1px var(--ghost)}
  .row[data-gaze="PINCH"] .spot{
    background:radial-gradient(90px circle at var(--mx,50%) var(--my,50%),rgba(74,246,38,.30),transparent 70%);
    transition:opacity .32s ease;
  }
  .row[data-gaze="PINCH"].sampled .spot{opacity:1;transition:opacity 0s}

  .row[data-gaze="FOVEA"]:hover{box-shadow:inset 0 0 0 1px rgba(79,214,224,.3)}
  .row[data-gaze="FOVEA"] .spot{
    background:radial-gradient(200px circle at var(--mx,50%) var(--my,50%),rgba(79,214,224,.16),transparent 60%);
  }
  .row[data-gaze="FOVEA"]:hover .spot{opacity:1}

  .row[data-gaze="NONE"]:hover{background:#0A1408}

  .row[aria-current="true"]{background:#0C1D09;box-shadow:inset 0 0 0 1px var(--ghost)}

  /* ---- badges ---- */
  .b{
    font-family:var(--cond);font-size:10px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;text-align:center;
    padding:2px 0;border-radius:3px;border:1px solid transparent;
  }
  .b.eng{color:#2F7A26;letter-spacing:.06em}
  .b.inp{color:var(--dim);border-color:var(--rule)}
  .gz.SHADER{color:var(--phosphor);border-color:#2A6B22;background:#0C2007}
  .gz.PINCH{color:var(--dim);border-color:var(--rule)}
  .gz.FOVEA{color:var(--fovea);border-color:#12363A;background:#06181A}
  .gz.NONE{color:#2A5E22;border-color:transparent}
  .st.OK{color:var(--dim)}
  .st.WIP{color:var(--amber)}
  .st.ARCH32,.st.ISA,.st.ABANDON{color:var(--fault)}

  /* ---- detail ---- */
  .detail{
    border-top:1px solid var(--rule);
    padding:14px 26px;
    display:flex;gap:10px 30px;flex-wrap:wrap;align-items:baseline;
    background:#060A0D;
  }
  .dlabel{
    font-family:var(--cond);font-size:10px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:#2A6B22;
    display:block;margin-bottom:3px;
  }
  .dval{font-size:12.5px;color:var(--dim);white-space:nowrap}
  .dval b{color:var(--phosphor);font-weight:500;font-variant-numeric:tabular-nums}

  /* ---- status line ---- */
  .status{
    display:flex;gap:22px;flex-wrap:wrap;align-items:center;
    padding:9px 26px;
    border-top:1px solid var(--rule);
    background:#04070A;
    font-family:var(--cond);font-size:10.5px;font-weight:500;
    letter-spacing:.11em;text-transform:uppercase;color:#2A6B22;
  }
  .status b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
  .status .ok b{color:var(--phosphor)}
  .status .warn b{color:var(--amber)}
  .status .bad b{color:var(--fault)}
  .legend{margin-left:auto;display:flex;gap:14px}
  .legend i{font-style:normal;display:inline-flex;align-items:center;gap:5px}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
  @media (max-width:720px){
    .runtime{display:none}
    .cols{display:none}
  }
</style>

<div class="window">
  <header>
    <span class="mark">KLEPTON<span class="slash"> // </span>LIBRARY</span>
    <span class="path">~/xr/apks<span class="cursor"></span></span>
    <span class="runtime">
      <span>runtime <b>0.9.4</b></span>
      <span>xr <b>CompositorServices</b></span>
      <span>host <b>visionOS 27.0</b></span>
    </span>
  </header>

  <div class="cols">
    <span>Title</span><span>Engine</span><span>Input</span><span>Gaze</span><span>Status</span>
  </div>

  <div class="tree" id="tree"></div>

  <div class="detail" id="detail"></div>

  <div class="status" id="status"></div>
</div>

<div class="bar"></div>
<div class="barcap">window bar</div>

<script>
const LIB = [
  { dir:"shell/", meta:"native · RealityKit entities", state:"ok", rows:[
    { n:"Library Browser",        e:"native",  i:"GAZE",  g:"SHADER", s:"OK",
      d:"native entity tree · HoverEffectComponent(.shader) · full gaze intensity in-material" },
    { n:"Guardian Overlay",       e:"native",  i:"GAZE",  g:"SHADER", s:"OK",
      d:"native entity tree · ShaderGraphMaterial Hover State node · 90 Hz" },
  ]},
  { dir:"quest/", meta:"arm64 · IL2CPP · OpenXR", state:"ok", rows:[
    { n:"Rhythm Blades 1.40",        e:"IL2CPP",  i:"SENSE", g:"PINCH",  s:"OK",
      d:"libil2cpp.so → dylib · 2,847 x18 sites patched · GLES3.2 → ANGLE/Metal · 0 JIT sites" },
    { n:"Time Shift",            e:"IL2CPP",  i:"HAND",  g:"PINCH",  s:"OK",
      d:"ARKit skeleton → XR_EXT_hand_tracking · 26/27 joints mapped · GLES3.2 → ANGLE/Metal" },
    { n:"Sketch Space",              e:"IL2CPP",  i:"HAND",  g:"PINCH",  s:"OK",
      d:"scene-graph intercept · entities reconstructed · gaze sampled at pinch-down" },
    { n:"Physics Lab",                e:"IL2CPP",  i:"SENSE", g:"NONE",   s:"OK",
      d:"Vulkan → MoltenVK · submits stereo framebuffer · no entity tree, no hover path" },
    { n:"Outer Zone",        e:"UE4",     i:"SENSE", g:"NONE",   s:"OK",
      d:"Vulkan → MoltenVK · framebuffer submit · locomotion requires Sense thumbstick" },
    { n:"Deep Station",           e:"UE4",     i:"SENSE", g:"NONE",   s:"OK",
      d:"Vulkan → MoltenVK · framebuffer submit · foveation extension not advertised" },
    { n:"Village Siege",     e:"UE4",     i:"SENSE", g:"NONE",   s:"OK",
      d:"Vulkan → MoltenVK · framebuffer submit · XR_FB_passthrough stubbed" },
    { n:"Social Hub",                 e:"IL2CPP",  i:"SENSE", g:"NONE",   s:"ABANDON",
      d:"anticheat rejects relinked images · Mono JIT required for udon · not pursued" },
  ]},
  { dir:"quest1/", meta:"arm64 · VrApi · legacy compositor", state:"ok", rows:[
    { n:"Rhythm Blades 1.6",         e:"IL2CPP",  i:"SENSE", g:"PINCH",  s:"OK",
      d:"vrapi_SubmitFrame2 → CompositorServices · cylinder layer remapped · 1 compositor" },
    { n:"Rhythm Blades 1.28",        e:"IL2CPP",  i:"SENSE", g:"PINCH",  s:"OK",
      d:"vrapi_SubmitFrame2 → CompositorServices · osig check bypassed at runtime" },
    { n:"Source Port VR",         e:"GLES3",   i:"SENSE", g:"NONE",   s:"OK",
      d:"source engine port · GLES3 → ANGLE/Metal · framebuffer submit" },
    { n:"Arena Port VR",  e:"Xash3D",  i:"SENSE", g:"NONE",   s:"OK",
      d:"Xash3D FWGS · GLES2 path · framebuffer submit" },
    { n:"Puzzle Port VR",              e:"GLES3",   i:"SENSE", g:"NONE",   s:"OK",
      d:"source engine port · GLES3 → ANGLE/Metal · framebuffer submit" },
    { n:"City Port VR",           e:"native",  i:"STICK", g:"NONE",   s:"WIP",
      d:"native engine port · locomotion needs Sense stick · audio backend unmapped" },
  ]},
  { dir:"go+gearvr/", meta:"armeabi-v7a · VrApi · Mono", state:"blocked", rows:[
    { n:"Gaze Quest",             e:"Mono",    i:"GAZE",  g:"NONE",   s:"ARCH32",
      d:"armeabi-v7a only · AArch32 removed from Apple silicon at EL0 · no execution mode" },
    { n:"Reef Drift",             e:"Mono",    i:"GAZE",  g:"NONE",   s:"ARCH32",
      d:"armeabi-v7a only · Mono JIT scripting backend · double-blocked" },
    { n:"Block World",     e:"Java",    i:"STICK", g:"NONE",   s:"ARCH32",
      d:"armeabi-v7a · full ART dependency · Activity-heavy · out of scope" },
  ]},
  { dir:"rift-pc/", meta:"x86-64 · LibOVR · D3D11", state:"blocked", rows:[
    { n:"PC Exclusive",              e:"D3D11",   i:"SENSE", g:"NONE",   s:"ISA",
      d:"wrong ISA · Win32 + D3D11 · x86 translation needs JIT — route via _streaming/" },
    { n:"PC Shooter",            e:"D3D11",   i:"SENSE", g:"NONE",   s:"ISA",
      d:"wrong ISA · Win32 + D3D11 · x86 translation needs JIT — route via _streaming/" },
  ]},
  { dir:"_streaming/", meta:"CloudXR · Foveated Streaming", state:"ok", rows:[
    { n:"PC Stream Link",           e:"OpenXR",  i:"SENSE", g:"FOVEA",  s:"WIP",
      d:"gaze drives foveation inside the secure session · never exposed to the app · ~48 ms" },
    { n:"Stream Bridge",        e:"OpenXR",  i:"SENSE", g:"FOVEA",  s:"OK",
      d:"NVIDIA CloudXR 6.0 endpoint · dynamic foveated transport · RTX 40/50 host" },
  ]},
];

const GLYPH = (last) => last ? "└──" : "├──";
const tree = document.getElementById("tree");

LIB.forEach((grp, gi) => {
  const g = document.createElement("div");
  g.className = "group";
  g.dataset.open = "true";

  const head = document.createElement("button");
  head.className = "grouphead";
  head.type = "button";
  head.setAttribute("aria-expanded","true");
  head.innerHTML =
    `<span class="chev">▾</span><span class="gname">${grp.dir}</span>` +
    `<span class="gmeta">${grp.meta}</span>` +
    `<span class="gtag ${grp.state==="blocked"?"blocked":"ok"}">` +
    `${grp.state==="blocked"?"blocked":grp.rows.length+" titles"}</span>`;
  head.addEventListener("click", () => {
    const open = g.dataset.open === "true";
    g.dataset.open = String(!open);
    head.setAttribute("aria-expanded", String(!open));
  });

  const rows = document.createElement("div");
  rows.className = "rows";

  grp.rows.forEach((r, ri) => {
    const row = document.createElement("button");
    row.className = "row" + (r.s==="ARCH32"||r.s==="ISA"||r.s==="ABANDON" ? " blocked" : "");
    row.type = "button";
    row.dataset.gaze = r.g;
    row.dataset.detail = r.d;
    row.dataset.name = r.n;
    row.innerHTML =
      `<span class="spot"></span>` +
      `<span class="name"><span class="glyph">${GLYPH(ri===grp.rows.length-1)}</span> ${r.n}</span>` +
      `<span class="b eng">${r.e}</span>` +
      `<span class="b inp">${r.i}</span>` +
      `<span class="b gz ${r.g}">${r.g}</span>` +
      `<span class="b st ${r.s}">${r.s}</span>`;

    row.addEventListener("pointermove", e => {
      const b = row.getBoundingClientRect();
      row.style.setProperty("--mx", (e.clientX-b.left)+"px");
      row.style.setProperty("--my", (e.clientY-b.top)+"px");
    });
    row.addEventListener("pointerdown", () => {
      if (r.g === "PINCH") {
        row.classList.add("sampled");
        setTimeout(() => row.classList.remove("sampled"), 340);
      }
    });
    row.addEventListener("click", () => select(row));
    rows.append(row);
  });

  g.append(head, rows);
  tree.append(g);
});

const detail = document.getElementById("detail");
function select(row){
  document.querySelectorAll(".row[aria-current]").forEach(r => r.removeAttribute("aria-current"));
  row.setAttribute("aria-current","true");
  const gaze = row.dataset.gaze;
  const model = {
    SHADER:"continuous intensity in-material",
    PINCH:"single sample at pinch-down",
    FOVEA:"consumed in-session, never exposed",
    NONE:"unavailable on this render path"
  }[gaze];
  detail.innerHTML =
    `<div><span class="dlabel">Selected</span><span class="dval"><b>${row.dataset.name}</b></span></div>` +
    `<div><span class="dlabel">Gaze model</span><span class="dval"><b>${gaze}</b> — ${model}</span></div>` +
    `<div><span class="dlabel">Translation</span><span class="dval">${row.dataset.detail}</span></div>`;
}
select(document.querySelector('.row[data-gaze="SHADER"]'));

const all = LIB.flatMap(g => g.rows);
const n = s => all.filter(r => r.s === s).length;
document.getElementById("status").innerHTML =
  `<span class="ok">indexed <b>${all.length}</b></span>` +
  `<span class="ok">runnable <b>${n("OK")}</b></span>` +
  `<span class="warn">partial <b>${n("WIP")}</b></span>` +
  `<span class="bad">blocked <b>${n("ARCH32")+n("ISA")+n("ABANDON")}</b></span>` +
  `<span class="legend">` +
    `<i><span class="dot" style="background:var(--phosphor)"></span>shader hover</i>` +
    `<i><span class="dot" style="background:var(--dim)"></span>pinch sample</i>` +
    `<i><span class="dot" style="background:var(--fovea)"></span>in-session</i>` +
    `<i><span class="dot" style="background:#2A5E22"></span>none</i>` +
  `</span>`;
</script>
